<!DOCTYPE html>

<style>
/* ----------------------------------------------------------
   GLOBAL STYLING — White with Teal + Navy accents
---------------------------------------------------------- */
body {
    margin: 0;
    padding: 0;
    font-family: "Inter", sans-serif;
    background: white;
    color: #002b45; /* deep navy */
}

h1, h2, h3 {
    margin: 0 0 15px 0;
    color: #002b45;
}

button {
    background: #008b8b; /* teal */
    color: white;
    border: none;
    padding: 14px 24px;
    border-radius: 10px;
    font-size: 1rem;
    cursor: pointer;
    transition: 0.2s;
}

button:hover {
    background: #006f6f;
}

.container {
    width: 95%;
    max-width: 700px;
    margin: 0 auto;
    padding: 25px;
}

.section {
    margin-bottom: 35px;
    padding: 20px;
    border: 2px solid #e6f2f2;
    border-radius: 12px;
}

input[type="number"],
input[type="text"],
select {
    width: 100%;
    padding: 12px;
    border: 2px solid #b0dede;
    border-radius: 10px;
    margin-top: 6px;
    font-size: 1rem;
}

.subject-list {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
}

.subject-chip {
    padding: 10px 14px;
    border-radius: 10px;
    background: #f4ffff;
    border: 2px solid #b0eaea;
    cursor: pointer;
    user-select: none;
}

.subject-chip.active {
    background: #008b8b;
    color: white;
    border-color: #006f6f;
}

.toggle-row {
    display: flex;
    align-items: center;
    gap: 10px;
}

.hidden {
    display: none !important;
}

/* Reveal card */
.reveal-card {
    margin-top: 50px;
    padding: 40px;
    border-radius: 20px;
    text-align: center;
    border: 3px solid #008b8b;
    background: #f7ffff;
}

.big {
    font-size: 2rem;
    margin-bottom: 20px;
}

.word {
    font-size: 2.2rem;
    font-weight: bold;
    margin-top: 20px;
    color: #005f5f;
}
</style>
</head>

<div class="container">

    <h1>Imposter — QCAA Edition</h1>

    <!-- -----------------------------------
         SUBJECT SELECTION
    ------------------------------------ -->
    <div class="section">
        <h2>Select Subjects</h2>
        <div id="subject-list" class="subject-list"></div>
    </div>

    <!-- -----------------------------------
         IA SELECTION
    ------------------------------------ -->
    <div class="section">
        <h2>Select IA</h2>
        <select id="ia-select">

            <option value="IA3">IA3</option>
            <option value="IA4">IA4</option>

    </div>

    <!-- -----------------------------------
         DIFFICULTY
    ------------------------------------ -->
    <div class="section">

        <select id="difficulty-select">
            <option value="Easy">Easy</option>
            <option value="Medium">Medium</option>
            <option value="Hard">Hard</option>
        </select>
    </div>

    <!-- -----------------------------------
         PLAYER COUNT
    ------------------------------------ -->
    <div class="section">
        <h2>Number of Players</h2>
        <input id="player-count" type="number" min="4" max="20" value="4" />
    </div>

    <!-- -----------------------------------
         PLAYER NAMES
    ------------------------------------ -->
    <div class="section">
        <h2>Player Names</h2>
        <div id="player-name-fields"></div>
    </div>

    <!-- -----------------------------------
         HINT TOGGLE
    ------------------------------------ -->
    <div class="section">
        <h2>Hint Options</h2>
        <div class="toggle-row">
            <input id="hint-toggle" type="checkbox" />
            <label for="hint-toggle">Give Imposter a Subject Hint</label>
        </div>
    </div>

    <!-- -----------------------------------
         START BUTTON
    ------------------------------------ -->
    <button id="start-btn">Start Game</button>

    <!-- -----------------------------------
         REVEAL SCREEN
    ------------------------------------ -->
    <div id="reveal-screen" class="hidden">

            <div id="reveal-word" class="word"></div>

        </div>
    </div>

</div>

/* ============================================================
   PAGE INITIALISATION
============================================================ */
const subjectListDiv = document.getElementById("subject-list");
const playerNameFields = document.getElementById("player-name-fields");
const playerCountInput = document.getElementById("player-count");
const startBtn = document.getElementById("start-btn");

let selectedSubjects = new Set();

/* Generate subject selection chips */
SUBJECTS.forEach(sub => {
    const chip = document.createElement("div");
    chip.className = "subject-chip";
    chip.textContent = sub;

    chip.addEventListener("click", () => {
        chip.classList.toggle("active");

        if (chip.classList.contains("active")) {
            selectedSubjects.add(sub);
        } else {
            selectedSubjects.delete(sub);
        }
    });

    subjectListDiv.appendChild(chip);
});

    playerNameFields.innerHTML = "";
    for (let i = 1; i <= count; i++) {
        const input = document.createElement("input");
        input.type = "text";
        input.placeholder = "Player " + i + " Name";
        input.id = "player" + i;
        playerNameFields.appendChild(input);
    }
}

playerCountInput.addEventListener("input", updatePlayerFields);
updatePlayerFields();

/* ============================================================
   GAME LOGIC
============================================================ */
let players = [];
let impostorIndex = null;
let currentReveal = 0;
let chosenWord = "";
let chosenSubject = "";

startBtn.addEventListener("click", () => {

    if (selectedSubjects.size === 0) {
        alert("Please select at least one subject.");
        return;
    }

    players = [];
    const count = Number(playerCountInput.value);

    for (let i = 1; i <= count; i++) {
        const name = document.getElementById("player" + i).value.trim();
        players.push(name || "Player " + i);
    }

    /* Choose word */
    const subjectArray = Array.from(selectedSubjects);
    chosenSubject = subjectArray[Math.floor(Math.random() * subjectArray.length)];

    const IA = document.getElementById("ia-select").value;
    const diff = document.getElementById("difficulty-select").value;

    const wordPool = WORD_BANK[chosenSubject][IA][diff];

    chosenWord = wordPool[Math.floor(Math.random() * wordPool.length)];

    /* Choose impostor */
    impostorIndex = Math.floor(Math.random() * players.length);
    currentReveal = 0;

    document.body.scrollTop = 0;
    document.documentElement.scrollTop = 0;

    document.getElementById("reveal-screen").classList.remove("hidden");
    showReveal();
});

/* Show reveal card */
function showReveal() {
    const name = players[currentReveal];
    const playerDiv = document.getElementById("reveal-player");
    const roleDiv = document.getElementById("reveal-role");
    const subjectDiv = document.getElementById("reveal-subject");
    const wordDiv = document.getElementById("reveal-word");

    playerDiv.textContent = name;

    if (currentReveal === impostorIndex) {
        roleDiv.textContent = "You ARE the Imposter.";
        subjectDiv.textContent = document.getElementById("hint-toggle").checked
            ? "Subject Hint: " + chosenSubject
            : "";
        wordDiv.textContent = "";
    } else {
        roleDiv.textContent = "You are NOT the Imposter.";
        subjectDiv.textContent = "Subject: " + chosenSubject;
        wordDiv.textContent = chosenWord;
    }
}

/* Next button */
document.getElementById("next-btn").addEventListener("click", () => {
    currentReveal++;

    if (currentReveal >= players.length) {
        alert("Everyone has seen their word. Begin the discussion!");
        document.getElementById("reveal-screen").classList.add("hidden");
        return;
    }

    showReveal();
});
</script>
